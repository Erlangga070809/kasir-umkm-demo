<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Kasir UMKM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card glass-card">
      <div class="login-header">
        <img src="assets/logo.png" alt="Kasir UMKM" class="login-logo" onerror="this.style.display='none'">
        <h1 class="login-title">Kasir UMKM</h1>
        <p class="login-subtitle">Masuk ke akun Anda</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="Masukkan email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePassword">👁</button>
          </div>
        </div>
        <div id="loginError" class="alert alert-error" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-full" id="loginButton">
          <span id="loginButtonText">Masuk</span>
          <span id="loginSpinner" class="spinner" style="display:none;"></span>
        </button>
      </form>
      <div class="login-footer">
        <p>Kasir UMKM &copy; 2024</p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
